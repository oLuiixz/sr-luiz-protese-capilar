<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuração inicial | SR Luiz</title><link rel="stylesheet" href="/admin/admin.css"></head><body><main class="shell"><header><a href="/" class="brand">SR LUIZ <span>BARBEARIA</span></a><span class="tag">PRIMEIRO ACESSO</span></header><section class="panel auth"><p class="eyebrow">CONFIGURAÇÃO SEGURA</p><h1>Criar administrador</h1><p class="muted">Defina o e-mail e a senha que serão usados para acessar o painel. Essa etapa só pode ser realizada uma vez.</p><form id="setup"><label>Código de configuração<input name="token" required autocomplete="off"></label><label>E-mail do administrador<input name="email" type="email" required autocomplete="username"></label><label>Senha (mínimo 12 caracteres)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><button>Criar acesso administrativo</button></form><p id="msg" class="msg"></p></section></main><script type="module" src="/admin/setup.js"></script></body></html>
